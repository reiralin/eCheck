<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRD Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- ══════════════════════════════════════════
       TEMPLATE ENGINE STYLES
       Shared layout, tokens, and all components.
       ══════════════════════════════════════════ -->
  <style>
    /* ── Design Tokens ── */
    :root {
      --font-sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'DM Mono', monospace;

      --text-primary: #1A1917;
      --text-secondary: #5C5A52;
      --bg-primary: #FAFAF8;
      --bg-secondary: #F4F3EF;
      --border-color: #E2E0D8;

      --accent: #1D9E75;
      --accent-dark: #0F6E56;
      --accent-light: #E1F5EE;

      --warn-bg: #FAEEDA;
      --warn-fg: #633806;
      --warn-border: #EF9F27;

      --info-bg: #E6F1FB;
      --info-fg: #0C447C;

      --danger-border: #E24B4A;
      --danger-fg: #A32D2D;

      --dept-food-bg: var(--accent-light);
      --dept-food-fg: var(--accent-dark);
      --dept-eval-bg: var(--warn-bg);
      --dept-eval-fg: var(--warn-fg);
      --dept-store-bg: var(--info-bg);
      --dept-store-fg: var(--info-fg);
      --dept-it-bg: #EEEDFE;
      --dept-it-fg: #3C3489;

      --raci-r-bg: var(--accent-light);
      --raci-r-fg: var(--accent-dark);
      --raci-a-bg: var(--warn-bg);
      --raci-a-fg: var(--warn-fg);
      --raci-c-bg: var(--info-bg);
      --raci-c-fg: var(--info-fg);
      --raci-i-bg: #F1EFE8;
      --raci-i-fg: #444441;

      --sidebar-w: 220px;
      --r-sm: 4px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-pill: 20px;
      --border: 0.5px solid var(--border-color);
      --border-accent: 2px solid var(--accent);
      --border-warn: 0.5px solid var(--warn-border);
      --border-warn-l: 3px solid var(--warn-border);
    }

    /* ── Reset ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ══════════════════════════════
       LAYOUT — SIDEBAR
       ══════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      background: #fff;
      border-right: var(--border);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 200;
      display: flex;
      flex-direction: column;
      transition: transform .25s ease;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      border-bottom: var(--border);
    }

    .logo-badge {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent-dark);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--r-pill);
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .sidebar-logo h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }

    .sidebar-logo p {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 18px;
      border-top: var(--border);
      font-size: 10px;
      color: var(--text-secondary);
    }

    /* ── Nav ── */
    .nav-section {
      padding: 12px 0 8px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 0 18px;
      margin-bottom: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: background .12s, color .12s;
    }

    .nav-item:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .nav-item.active {
      color: var(--accent-dark);
      border-left-color: var(--accent);
      background: var(--accent-light);
      font-weight: 500;
    }

    .nav-num {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--accent);
      min-width: 18px;
    }

    /* ── Mobile Top Bar ── */
    .topbar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      z-index: 300;
      background: #fff;
      border-bottom: var(--border);
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }

    .topbar-badge {
      font-size: 10px;
      font-weight: 600;
      background: var(--accent-light);
      color: var(--accent-dark);
      padding: 2px 7px;
      border-radius: var(--r-pill);
    }

    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      border-radius: var(--r-sm);
    }

    .menu-btn span {
      display: block;
      width: 20px;
      height: 1.5px;
      background: var(--text-primary);
      transition: .2s;
    }

    .menu-btn.open span:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }

    .menu-btn.open span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn.open span:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    /* Overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      z-index: 150;
    }

    .overlay.show {
      display: block;
    }

    /* ── Main ── */
    .main {
      margin-left: var(--sidebar-w);
      max-width: 940px;
      padding: 0 40px 80px;
    }

    .section-block {
      padding: 40px 0 32px;
      border-bottom: var(--border);
    }

    .section-block:last-child {
      border-bottom: none;
    }

    .section-inner {
      padding: 1.5rem 0;
    }

    /* ══════════════════════════════
       TYPOGRAPHY
       ══════════════════════════════ */
    .sh {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: .08em;
      margin-bottom: .4rem;
    }

    .st {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 1rem;
    }

    .desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    /* ══════════════════════════════
       BADGES & TAGS
       ══════════════════════════════ */
    .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: var(--r-pill);
      font-weight: 500;
    }

    .badge-teal {
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    .badge-gray {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: var(--border);
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    .tag-warn {
      background: var(--warn-bg);
      color: var(--warn-fg);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    /* ══════════════════════════════
       CARDS & PANELS
       ══════════════════════════════ */
    .card {
      background: var(--bg-secondary);
      border: var(--border);
      border-radius: var(--r-lg);
      padding: 14px 16px;
    }

    .card-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .card-val {
      font-size: 20px;
      font-weight: 500;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .panel {
      background: var(--bg-primary);
      border: var(--border);
      border-radius: var(--r-md);
      padding: 14px 16px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: var(--border);
    }

    .pr {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .dot--accent {
      background: var(--accent);
    }

    .dot--warn {
      background: var(--warn-border);
    }

    .fix-banner {
      background: var(--warn-bg);
      border: var(--border-warn);
      border-radius: var(--r-md);
      padding: 7px 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--warn-fg);
    }

    .note {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--bg-secondary);
      border-radius: var(--r-md);
    }

    .callout {
      background: var(--bg-secondary);
      border-left: var(--border-warn-l);
      border-radius: 0 var(--r-md) var(--r-md) 0;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ══════════════════════════════
       GRIDS (responsive)
       ══════════════════════════════ */
    .grid {
      display: grid;
      gap: 10px;
    }

    .g-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .g-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .g-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    /* ══════════════════════════════
       COVER
       ══════════════════════════════ */
    .prd-wrap {
      padding: 2rem 0 1rem;
    }

    .header-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: var(--border-accent);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      gap: 16px;
    }

    .proj-title {
      font-size: 22px;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .proj-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .hbar-meta {
      text-align: right;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .hbar-meta strong {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-top: 4px;
    }

    .toc-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .toc-card {
      background: var(--bg-secondary);
      border-radius: var(--r-md);
      padding: 10px 12px;
      border: var(--border);
    }

    .toc-num {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .toc-label {
      font-size: 13px;
      font-weight: 500;
    }

    /* ══════════════════════════════
       SECTION 01 — PROJ COMPARE
       ══════════════════════════════ */
    .proj-card {
      border-radius: var(--r-md);
      padding: 12px 14px;
      border: var(--border);
    }

    .proj-card--food {
      border-color: var(--accent);
    }

    .proj-card--eval {
      border-color: var(--warn-border);
    }

    .proj-head {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .proj-head--food {
      color: var(--accent-dark);
    }

    .proj-head--eval {
      color: var(--warn-fg);
    }

    .proj-item {
      font-size: 14px;
      color: var(--text-secondary);
      padding: 2px 0;
    }

    /* ══════════════════════════════
       SECTION 02 — SVG WRAP
       ══════════════════════════════ */
    .svg-wrap {
      width: 100%;
      overflow-x: auto;
      border: var(--border);
      border-radius: var(--r-lg);
      background: #141412;
      padding: 8px;
    }

    .svg-wrap svg {
      display: block;
      min-width: 580px;
    }

    /* ══════════════════════════════
       SECTION 03 — RACI
       ══════════════════════════════ */
    .raci-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .raci-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 560px;
    }

    .raci-table th,
    .raci-table td {
      padding: 8px;
      border: var(--border);
      text-align: center;
    }

    .raci-table th {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 11px;
    }

    .raci-table td:first-child {
      text-align: left;
    }

    .rb {
      font-weight: 500;
      border-radius: var(--r-sm);
      padding: 2px 8px;
      display: inline-block;
    }

    .rb-R {
      background: var(--raci-r-bg);
      color: var(--raci-r-fg);
    }

    .rb-A {
      background: var(--raci-a-bg);
      color: var(--raci-a-fg);
    }

    .rb-C {
      background: var(--raci-c-bg);
      color: var(--raci-c-fg);
    }

    .rb-I {
      background: var(--raci-i-bg);
      color: var(--raci-i-fg);
    }

    .raci-legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 11px;
      flex-wrap: wrap;
    }

    /* ══════════════════════════════
       SECTION 04 — FEATURES
       ══════════════════════════════ */
    .feat-card {
      border: var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
    }

    .feat-head {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .feat-dot--accent {
      background: var(--accent);
    }

    .feat-dot--warn {
      background: var(--warn-border);
    }

    .feat-dot--info {
      background: var(--info-fg);
    }

    .feat-dot--dark {
      background: #3B6D11;
    }

    .feat-dot--purple {
      background: var(--dept-it-fg);
    }

    .feat-card--wide {
      grid-column: span 2;
    }

    .feat-item {
      font-size: 14px;
      color: var(--text-secondary);
      padding: 2px 0 2px 16px;
      position: relative;
    }

    .feat-item::before {
      content: '·';
      position: absolute;
      left: 4px;
      color: var(--text-secondary);
    }

    /* ══════════════════════════════
       SECTION 05 — DEPT GRID
       ══════════════════════════════ */
    .dc {
      border: var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
    }

    .dn {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: var(--border);
    }

    .dn--food {
      color: var(--dept-food-fg);
    }

    .dn--eval {
      color: var(--dept-eval-fg);
    }

    .dn--store {
      color: var(--dept-store-fg);
    }

    .dn--it {
      color: var(--dept-it-fg);
    }

    .ci {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 5px;
    }

    .cic {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cic--food {
      background: var(--dept-food-bg);
      color: var(--dept-food-fg);
    }

    .cic--eval {
      background: var(--dept-eval-bg);
      color: var(--dept-eval-fg);
    }

    .cic--store {
      background: var(--dept-store-bg);
      color: var(--dept-store-fg);
    }

    .cic--it {
      background: var(--dept-it-bg);
      color: var(--dept-it-fg);
    }

    .ct {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* ══════════════════════════════
       SECTION 06 — ROADMAP
       ══════════════════════════════ */
    .roadmap {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .phase {
      border: var(--border);
      padding: 14px 12px;
    }

    .phase:not(:first-child) {
      border-left: none;
    }

    .phase:first-child {
      border-radius: var(--r-md) 0 0 var(--r-md);
    }

    .phase:last-child {
      border-radius: 0 var(--r-md) var(--r-md) 0;
    }

    .ph-badge {
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      display: inline-block;
      margin-bottom: 8px;
    }

    .ph-badge--mvp {
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    .ph-badge--integration {
      background: var(--info-bg);
      color: var(--info-fg);
    }

    .ph-badge--notify {
      background: var(--warn-bg);
      color: var(--warn-fg);
    }

    .ph-badge--ai {
      background: var(--dept-it-bg);
      color: var(--dept-it-fg);
    }

    .ph-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .ph-item {
      font-size: 14px;
      color: var(--text-secondary);
      padding: 2px 0 2px 16px;
      position: relative;
      line-height: 1.4;
    }

    .ph-item::before {
      content: '·';
      position: absolute;
      left: 1px;
    }

    .ben-card {
      border-radius: var(--r-md);
      padding: 12px 14px;
      border: var(--border);
    }

    .ben-card--accent {
      border-color: var(--accent);
    }

    .ben-card--warning {
      border-color: var(--warn-border);
    }

    .ben-card--purple {
      border-color: #7F77DD;
    }

    .ben-num {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .ben-num--accent {
      color: var(--accent-dark);
    }

    .ben-num--warning {
      color: #BA7517;
    }

    .ben-num--purple {
      color: var(--dept-it-fg);
    }

    .ben-label {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* ══════════════════════════════
       APPENDIX
       ══════════════════════════════ */
    .cp-card {
      border: var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
    }

    .cp-head {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: var(--border);
    }

    .cp-head--danger {
      color: var(--danger-fg);
    }

    .cp-head--success {
      color: var(--accent-dark);
    }

    .old-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-style: italic;
      background: var(--bg-secondary);
      padding: 8px 10px;
      border-radius: var(--r-sm);
      border-left: 3px solid var(--danger-border);
    }

    .item-card {
      border: var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .item-q {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .sub-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sub-tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      border: var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      cursor: default;
    }

    .sub-tag:hover,
    .sub-tag--active {
      background: var(--accent-light);
      border-color: var(--accent);

       ══════════════════════════════ */
    .wbs-group {

    }

    .wbs-group-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      padding: 6px 12px;
      border-radius: var(--r-md) var(--r-md) 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wbs-group-label--accent {
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    .wbs-group-label--info {
      background: var(--info-bg);
      color: var(--info-fg);
    }

    .wbs-group-label--warn {
      background: var(--warn-bg);
      color: var(--warn-fg);
    }

    .wbs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .wbs-table th {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .06em;
      padding: 6px 10px;
      border: var(--border);
      text-align: left;
    }

    .wbs-table td {
      padding: 7px 10px;
      border: var(--border);
      vertical-align: top;
    }

    .wbs-table tr:hover td {
      background: var(--bg-secondary);
    }

    .wbs-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      white-space: nowrap;
    }

    .wbs-module {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .wbs-task {
      color: var(--text-primary);
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .wbs-table td:nth-child(2) {
        display: none;
      }
    }

    @media print {

      .sidebar,
      .topbar,
      .overlay,
      .menu-btn {
        display: none !important;
      }

      .main {
        margin-left: 0 !important;
        padding: 20px !important;
      }

      .section-block {
        page-break-inside: avoid;
      }
    }

    /* ══════════════════════════════
       RWD — TABLET  ≤ 1024px
       ══════════════════════════════ */
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .topbar {
        display: flex;
      }

      .main {
        margin-left: 0;
        padding: 72px 24px 60px;
        max-width: 100%;
      }

      .toc-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* ══════════════════════════════
       RWD — MOBILE  ≤ 640px
       ══════════════════════════════ */
    @media (max-width: 640px) {
      .main {
        padding: 64px 16px 60px;
      }

      .g-3,
      .g-4 {
        grid-template-columns: 1fr;
      }

      .g-2 {
        grid-template-columns: 1fr;
      }

      .toc-grid {
        grid-template-columns: 1fr;
      }

      .header-bar {
        flex-direction: column;
      }

      .hbar-meta {
        text-align: left;
      }

      .proj-compare,
      .two-col,
      .feat-grid,
      .dg,
      .compare,
      .benefit-row {
        grid-template-columns: 1fr !important;
      }

      .feat-card--wide {
        grid-column: span 1;
      }

      .roadmap {
        grid-template-columns: 1fr 1fr;
      }

      .roadmap .phase:nth-child(2) {
        border-left: var(--border);
      }

      .roadmap .phase:nth-child(3) {
        border-top: none;
      }

      .roadmap .phase:nth-child(4) {
        border-top: none;
        border-left: var(--border);
      }

      .roadmap .phase:first-child {
        border-radius: var(--r-md) 0 0 0;
      }

      .roadmap .phase:nth-child(2) {
        border-radius: 0 var(--r-md) 0 0;
      }

      .roadmap .phase:nth-child(3) {
        border-radius: 0 0 0 var(--r-md);
      }

      .roadmap .phase:last-child {
        border-radius: 0 0 var(--r-md) 0;
      }

      .proj-title {
        font-size: 18px;
      }

      .st {
        font-size: 16px;
      }
    }
  </style>
</head>

  <!-- ══════════════════════════

     ══════════════════════════ -->
  <script>
    (function () {
      const DATA = JSON.parse(document.getElementById('prd-data').textContent);
      const { doc, nav, sections } = DATA;

      /* ── helpers ── */
      const el = (tag, cls, html) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        return e;
      };
      const div = (cls, html) => el('div', cls, html);

      /* ════════════════════════════
         SIDEBAR
         ════════════════════════════ */
      const sidebarLogo = document.getElementById('sidebar-logo');
      sidebarLogo.innerHTML = `
    <span class="logo-badge">${doc.version}</span>
    <h1>${doc.name}</h1>
    <p>${doc.tagline}</p>`;

      const sidebarNav = document.getElementById('sidebar-nav');
      nav.forEach(n => {
        const a = el('a', 'nav-item', `<span class="nav-num">${n.num}</span>${n.label}`);
        a.href = `#${n.id}`;
        sidebarNav.appendChild(a);
      });

      document.getElementById('sidebar-footer').innerHTML =
        `<div>製表日期：${doc.date}</div><div style="margin-top:4px">版本：${doc.version}</div>`;

      /* ════════════════════════════
         TOP BAR (mobile)
         ════════════════════════════ */
      document.getElementById('topbar-title').textContent = doc.name;
      document.getElementById('topbar-badge').textContent = doc.version;
      document.title = doc.title;

      /* ── mobile menu toggle ── */
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuBtn = document.getElementById('menu-btn');
      menuBtn.addEventListener('click', toggle);
      overlay.addEventListener('click', close);
      function toggle() { sidebar.classList.toggle('open'); overlay.classList.toggle('show'); menuBtn.classList.toggle('open'); }
      function close() { sidebar.classList.remove('open'); overlay.classList.remove('show'); menuBtn.classList.remove('open'); }
      /* close on nav click (mobile) */
      document.querySelectorAll('.nav-item').forEach(a => a.addEventListener('click', close));


      /* ════════════════════════════
         BLOCK RENDERERS
         ════════════════════════════ */

      function renderStatCards(block) {
        const wrap = div('grid g-3');
        block.items.forEach(item => {
          wrap.appendChild(div('card', `
        <div class="card-label">${item.label}</div>
        <div class="card-val">${item.val}</div>
        <div class="card-sub">${item.sub}</div>`));
        });
        return wrap;
      }

      function renderCompareCards(block) {
        const wrap = div('proj-compare grid g-2');
        block.items.forEach(item => {
          const rows = item.items.map(t => `<div class="proj-item">${t}</div>`).join('');
          wrap.appendChild(div(`proj-card proj-card--${item.variant}`, `
        <div class="proj-head proj-head--${item.variant}">${item.title}</div>${rows}`));
        });
        return wrap;
      }

      function renderTwoColPanels(block) {
        const wrap = div('two-col grid g-2');
        block.items.forEach(item => {
          const rows = item.rows.map(r =>
            `<div class="pr"><span class="dot dot--${r.dot}"></span>${r.text}</div>`).join('');
          wrap.appendChild(div('panel', `<div class="panel-title">${item.title}</div>${rows}`));
        });
        return wrap;
      }

      function renderTagList(block) {
        const wrap = div('tag-list');
        block.items.forEach(item => {
          wrap.appendChild(el('span', `tag${item.warn ? ' tag-warn' : ''}`, item.text));
        });
        return wrap;
      }

      function renderSvgDiagram(block) {
        const wrap = div('svg-wrap');
        wrap.innerHTML = block.svg;
        return wrap;
      }

      function renderRaciTable(block) {
        const scroll = div('raci-scroll');
        const table = el('table', 'raci-table');
        const thead = el('thead');
        const hrow = el('tr');
        block.columns.forEach((col, i) => {
          const th = el('th', '', col);
          if (i === 0) th.style.textAlign = 'left';
          hrow.appendChild(th);
        });
        thead.appendChild(hrow);
        table.appendChild(thead);

        const tbody = el('tbody');
        block.rows.forEach(row => {
          const tr = el('tr');
          tr.appendChild(el('td', '', row.task));
          row.cells.forEach(c => {
            const td = el('td');
            if (c) td.innerHTML = `<span class="rb rb-${c}">${c}</span>`;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        scroll.appendChild(table);

        const legend = div('raci-legend', `
      <span><span class="rb rb-R">R</span> Responsible 執行者</span>
      <span><span class="rb rb-A">A</span> Accountable 當責者</span>
      <span><span class="rb rb-C">C</span> Consulted 諮詢</span>
      <span><span class="rb rb-I">I</span> Informed 知會</span>`);

        const wrap = div('');
        wrap.appendChild(scroll);
        wrap.appendChild(legend);
        return wrap;
      }

      function renderFeatGrid(block) {
        const wrap = div('feat-grid grid g-2');
        block.items.forEach(item => {
          const items = item.items.map(t => `<div class="feat-item">${t}</div>`).join('');
          const card = div('feat-card', `
        <div class="feat-head"><span class="feat-dot feat-dot--${item.dot}"></span>${item.title}</div>
        ${items}`);
          if (item.wide) card.classList.add('feat-card--wide');
          wrap.appendChild(card);
        });
        return wrap;
      }

      function renderDeptGrid(block) {
        const wrap = div('dg grid g-2');
        block.items.forEach(item => {
          const rows = item.items.map(t =>
            `<div class="ci"><div class="cic cic--${item.dept}">!</div><div class="ct">${t}</div></div>`).join('');
          wrap.appendChild(div('dc', `<div class="dn dn--${item.dept}">${item.name}</div>${rows}`));
        });
        return wrap;
      }

      function renderRoadmap(block) {
        const wrap = div('roadmap');
        block.phases.forEach(p => {
          const items = p.items.map(t => `<div class="ph-item">${t}</div>`).join('');
          wrap.appendChild(div('phase', `
        <span class="ph-badge ph-badge--${p.badge}">${p.label}</span>
        <div class="ph-title">${p.title}</div>${items}`));
        });
        return wrap;
      }

      function renderBenefitRow(block) {
        const wrap = div('benefit-row grid g-3');
        block.items.forEach(item => {
          wrap.appendChild(div(`ben-card ben-card--${item.variant}`, `
        <div class="ben-num ben-num--${item.variant}">${item.num}</div>
        <div class="ben-label">${item.label}</div>`));
        });
        return wrap;
      }

      function renderOldVsNew(block) {
        const wrap = div('compare grid g-2');

        // old
        const o = block.old;
        wrap.appendChild(div('cp-card', `
      <div class="cp-head cp-head--danger">${o.head}</div>
      <div class="old-text">${o.text}</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:8px">${o.note}</div>`));

        // new
        const n = block.new;
        const tags = n.tags.map(t =>
          `<span class="sub-tag${n.active ? ' sub-tag--active' : ''}">${t}</span>`).join('');
        wrap.appendChild(div('cp-card', `
      <div class="cp-head cp-head--success">${n.head}</div>
      <div class="sub-grid" style="margin-top:4px">${tags}</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:8px">${n.note}</div>`));

        return wrap;
      }

      function renderItemCard(block) {
        const tags = block.tags.map(t => `<span class="sub-tag">${t}</span>`).join('');
        return div('item-card', `
      <div style="font-size:11px;font-weight:500;color:var(--accent);margin-bottom:6px">${block.accent}</div>
      <div class="item-q">${block.question}</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">${block.subNote}</div>
      <div class="sub-grid">${tags}</div>`);
      }

      function renderWbsGroup(block) {
        const wrap = div('');
        block.groups.forEach(group => {
          const g = div('wbs-group');
          g.innerHTML = `<div class="wbs-group-label wbs-group-label--${group.color}">${group.label}</div>`;
          const scroll = div('raci-scroll');
          const table = el('table', 'wbs-table');
          table.innerHTML = `<thead><tr><th style="width:56px">ID</th><th style="width:100px">模組</th><th>可交付項目 / 任務</th></tr></thead>`;
          const tbody = el('tbody');
          group.rows.forEach(row => {
            tbody.innerHTML += `<tr>
          <td><span class="wbs-id">${row.id}</span></td>
          <td><span class="wbs-module">${row.module}</span></td>
          <td class="wbs-task">${row.task}</td>
        </tr>`;
          });
          table.appendChild(tbody);
          scroll.appendChild(table);
          g.appendChild(scroll);
          wrap.appendChild(g);
        });
        return wrap;
      }

      function renderBenList(block) {
        const wrap = div('benefit-row grid g-3');
        block.items.forEach(item => {
          wrap.appendChild(div('ben', `<strong>${item.title}</strong>${item.text}`));
        });
        return wrap;
      }

      function renderBlock(block) {
        switch (block.type) {
          case 'stat-cards': return renderStatCards(block);
          case 'compare-cards': return renderCompareCards(block);
          case 'two-col-panels': return renderTwoColPanels(block);
          case 'tag-list': return renderTagList(block);
          case 'svg-diagram': return renderSvgDiagram(block);
          case 'raci-table': return renderRaciTable(block);
          case 'feat-grid': return renderFeatGrid(block);
          case 'dept-grid': return renderDeptGrid(block);
          case 'roadmap': return renderRoadmap(block);
          case 'benefit-row': return renderBenefitRow(block);
          case 'old-vs-new': return renderOldVsNew(block);
          case 'item-card': return renderItemCard(block);
          case 'wbs-group': return renderWbsGroup(block);
          case 'ben-list': return renderBenList(block);
          default: return div('', `<!-- unknown block type: ${block.type} -->`);
        }
      }

      /* ════════════════════════════
         MAIN RENDER
         ════════════════════════════ */
      const main = document.getElementById('main');

      /* Cover */
      const coverSection = el('section', 'section-block', '');
      coverSection.id = 'cover';
      const badges = doc.badges.map(b =>
        `<span class="badge badge-${b.type}">${b.label}</span>`).join('');
      coverSection.innerHTML = `
    <div class="prd-wrap">
      <div class="header-bar">
        <div>
          <p class="proj-title">${doc.title}</p>
          <p class="proj-sub">${doc.subtitle}</p>
          <div class="badge-row">${badges}</div>
        </div>
        <div class="hbar-meta">
          <div>${doc.metaLeft}</div>
          <strong>${doc.metaRight}</strong>
        </div>
      </div>
    </div>`;
      main.appendChild(coverSection);

      /* Sections */
      sections.forEach(sec => {
        const section = el('section', 'section-block', '');
        section.id = sec.id;

        const inner = div('section-inner');
        inner.appendChild(div('sh', sec.num));
        inner.appendChild(div('st', sec.title));
        if (sec.desc) inner.appendChild(div('desc', sec.desc));

        sec.blocks.forEach(block => inner.appendChild(renderBlock(block)));

        section.appendChild(inner);
        main.appendChild(section);
      });

      /* ════════════════════════════
         SCROLL SPY
         ════════════════════════════ */
      const allSections = document.querySelectorAll('section[id]');
      const navItems = document.querySelectorAll('.nav-item');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            navItems.forEach(n => n.classList.remove('active'));
            const active = document.querySelector(`.nav-item[href="#${e.target.id}"]`);
            if (active) active.classList.add('active');
          }
        });
      }, { threshold: 0.25 });
      allSections.forEach(s => observer.observe(s));

    })();
  </script>
